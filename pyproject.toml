[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "advanced-ai-video-tools"
version = "2.0.0"
description = "Quality-first FFmpeg and Real-ESRGAN video preparation tools"
authors = [{ name = "Pastry Personal 5" }]
maintainers = [{ name = "Pastry Personal 5" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "loguru>=0.7,<1",
  "PySide6>=6.10,<7",
  "PyYAML>=6.0,<7",
]

[project.scripts]
advanced-ai-video-tools = "advanced_ai_video_tools.cli:main"
ai-video-tools = "advanced_ai_video_tools.cli:main"

[dependency-groups]
dev = [
  "black>=25.1,<27",
  "pycodestyle>=2.14,<3",
  "pylint>=3.3,<5",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/advanced_ai_video_tools"]

[tool.black]
# Black requires a finite value even though this project imposes no line limit.
line-length = 9999
target-version = ["py310"]

[tool.pylint.main]
py-version = "3.10"
source-roots = ["src"]
ignore-paths = ["^tests/fixtures/"]

[tool.pylint.messages_control]
disable = [
  "line-too-long",
  "duplicate-code",
  "fixme",
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-instance-attributes",
  "too-many-locals",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: exercises user-installed FFmpeg and FFprobe with tiny media",
]

[tool.coverage.run]
branch = true
source = ["advanced_ai_video_tools"]
